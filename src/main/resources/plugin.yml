name: HavocEco
version: '${project.version}'
main: club.havocsmp.eco.HavocEco
api-version: '1.21'
author: HavocSMP
description: Companion plugin for HavocSMP. Adds /invest, casino, rubies, amethyst tools, wagers, /live, /coords, cycling bossbar and combat/pearl/totem rules on top of Voyager.

# Voyager provides the Vault economy; if either is missing we log a warning and disable money features.
softdepend: [Vault, CuyVoyager]

commands:
  rubypay:
    description: Transfer rubies to another player.
  invest:
    description: Invest money (a money sink that matures over time).
  slots:
    description: Play the slot machine with money or rubies.
  jackpot:
    description: Enter or start a jackpot round.
  rubyshop:
    description: Open the ruby shop.
  live:
    description: Announce you are live (Media+ only).
  coords:
    description: Toggle hiding your coordinates.
  coinflip:
    description: Open, accept or cancel a coinflip wager.
    aliases: [cf]
  havoceco:
    description: Admin command.
    aliases: [heco]

permissions:
  havoceco.admin:
    description: Access to HavocEco admin commands.
    default: op
  havoceco.live:
    description: Allows use of /live (grant to Media+).
    default: false
  havoceco.live.bypass:
    description: Bypass the /live cooldown.
    default: op
