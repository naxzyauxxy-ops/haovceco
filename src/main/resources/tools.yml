# =====================================================================
#  Amethyst area-mining tools
#  CUBE-SIZE is N in an NxNxN dig area (odd sizes center on the block;
#  even sizes extend +1 on each axis).
#  TYPE controls what blocks the tool affects:
#    PICKAXE  -> stone/ore family
#    SHOVEL   -> dirt/sand/gravel family
#    AXE      -> logs/wood family
#    SELL_AXE -> logs/wood family, auto-sell recommended
#  AUTO-SELL true  -> mined blocks are sold instantly to money
#  AUTO-SELL false -> mined blocks drop normally
# =====================================================================
TOOLS:
  amethyst_pickaxe_3:
    DISPLAY-NAME: "&#f40d0dAmethyst Pickaxe &7(3x3x3)"
    MATERIAL: DIAMOND_PICKAXE
    TYPE: PICKAXE
    CUBE-SIZE: 3
    AUTO-SELL: false
    RUBY-PRICE: 500
    LORE:
      - "&7Mines a &f3x3x3 &7area."
      - "&7Blocks drop normally."

  amethyst_pickaxe_6:
    DISPLAY-NAME: "&#f40d0dAmethyst Pickaxe &7(6x6x6)"
    MATERIAL: DIAMOND_PICKAXE
    TYPE: PICKAXE
    CUBE-SIZE: 6
    AUTO-SELL: true
    RUBY-PRICE: 1500
    LORE:
      - "&7Mines a &f6x6x6 &7area."
      - "&7Auto-sells to money."

  amethyst_pickaxe_9:
